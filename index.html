<style>

:root{

  --blue:#7FB6E0; --blue-soft:#18304A;
  --good:#6FD39A; --good-soft:#133524; --bad:#FF8A7E; --bad-soft:#3D1B19; --warn:#F2C46B; --warn-soft:#3A2E12;
  --img-bg:#F6F4EF; --head:#0A111E; --head-ink:#EEF1F6; --head-muted:#94A0B6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#172238; --sunk:#111B2D; --line:#2A3A57;
  --ink:#EEF1F6; --ink-2:#C3CBDA; --muted:#94A0B6;
  --accent:#F29A5E; --accent-soft:#3A2618; --accent-ink:#FFC9A3;
  --blue:#7FB6E0; --blue-soft:#18304A;

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--head);color:var(--head-ink)}

.lead{max-width:68ch;color:var(--ink-2)}

th{font-family:var(--display);font-weight:600;background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.acc{color:#1a0d04}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.acc{color:#1a0d04}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.q{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.q .prompt{font-size:18px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
input[type=text],input[type=number],select{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;max-width:100%}
input.bad{border-color:var(--bad)} input.good{border-color:var(--good)}
.fb{border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--good-soft);color:var(--ink)} .fb.ok b:first-child{color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--ink)} .fb.no b:first-child{color:var(--bad)}

.ordersel{display:flex;flex-wrap:wrap;gap:8px}

.chosen{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:24px}
.stepper{display:flex;flex-direction:column;gap:8px}
.stepper .st{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}

details.uitleg>div{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.progress{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:700;font-size:14px}
.field .help{font-size:13px;color:var(--muted)}
.msg{font-size:14px;border-radius:8px;padding:6px 10px}
.msg.ok{background:var(--good-soft);color:var(--good)} .msg.no{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.report{border:2px solid var(--ink);border-radius:14px;padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:14px;max-width:760px}
.report .code{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:.08em;background:var(--sunk);border-radius:8px;padding:8px 12px;display:inline-block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--blue)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal>div{background:var(--surface);border-radius:14px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.glos{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:6px 18px}
.glos dt{font-weight:800} .glos dd{margin:0;color:var(--ink-2)}
@media (max-width:520px){.glos{grid-template-columns:1fr}.glos dd{margin-bottom:8px}}
.chaps{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tj{display:flex;flex-direction:column;gap:12px}
.lockbox{background:var(--warn-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.checklist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.checklist li{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fb,.st{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<script>
"use strict";
/* ---------- opslag ---------- */
const KEY='pchw-oefenapp-v1';
let S={naam:'',klas:'',prog:{},unlocked:false,prak:{},toets:null,lastTab:'theorie'};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- hulpjes ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickN(a,n){return shuffle(a).slice(0,n);}
function parseNum(v){const m=String(v==null?'':v).replace(/\s/g,'').replace(',','.').match(/-?\d+(\.\d+)?/);return m?+m[0]:null;}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* ---------- hoofdstukken en woordenlijst ---------- */
const CH={H1:'De computer en zijn onderdelen',H2:'De chipset',H3:'Processoren op de markt',H4:'Processorkoelers',H5:'ROM-geheugen',H6:'RAM-geheugen',P:'Praktijk: waar zit het probleem?'};
const G={
'Processor (CPU)':['Central Processing Unit. Voert alle berekeningen uit: de chef-kok.','H1'],
'Werkgeheugen (RAM)':['Geheugen voor wat nu open staat. Vluchtig: zonder stroom is alles weg. Het werkblad.','H1'],
'Opslag (SSD/HDD)':['Bewaart bestanden blijvend, ook zonder stroom. De voorraadkast.','H1'],
'ROM':['Read Only Memory: bevat vaste instructies (firmware) en houdt die zonder stroom.','H5'],
'Moederbord':['Motherboard: grote printplaat waarop alle onderdelen worden aangesloten.','H1'],
'Bus':['Bundel geleiders waarlangs gegevens reizen: een snelweg voor gegevens (bv. FSB, adresbus, databus).','H2'],
'Systeembus':['De bus tussen processor, chipset en geheugen; bestaat uit o.a. een adresbus en een databus.','H6'],
'Klokpuls':['Eén tik van de klokgenerator. Alle onderdelen werken op de maat van die tikken.','H2'],
'Uitbreidingssleuf':['Sleuf op het moederbord waarin je een extra kaart steekt, bv. een grafische kaart.','H2'],
'Optisch station':['Cd-, dvd- of Blu-ray-station: leest schijfjes met een laser.','H2'],
'Chipset':['Groep chips op het moederbord die het verkeer regelt tussen processor, geheugen en randapparaten: de verkeersagent.','H2'],
'Voeding (PSU)':['Power Supply Unit: zet 230 V wisselspanning (AC) om in gelijkspanning (DC) voor alle onderdelen.','H1'],
'Koeler':['Voert de warmte van de processor af: de dampkap.','H1'],
'Grafische kaart (GPU)':['Maakt het beeld voor je scherm. Nodig voor zware games, 3D en video.','H1'],
'SATA-kabel':['Datakabel tussen moederbord en harde schijf, SSD of dvd-station.','H1'],
'Behuizing':['De kast (case) die alles beschermt tegen stof en stoten.','H1'],
'Randapparaat':['Toestel rond de computer: toetsenbord, muis, scherm, printer, luidspreker.','H1'],
'System controller':['Functie van de chipset: klokgenerator, interrupts, DMA en energiebeheer.','H2'],
'Peripheral controller':['Functie van de chipset: uitbreidingskaarten, HDD/optische stations, toetsenbord, I/O controller randapparaten.','H2'],
'Memory controller':['Functie van de chipset: besturing van het werkgeheugen.','H2'],
'Klokgenerator':['Het "uurwerk" dat de maat (klokpulsen) aangeeft voor alle onderdelen.','H2'],
'North bridge':['Chip van de chipset die de processor verbindt met de snellere onderdelen (RAM, grafische kaart). Intel: MCH/GMCH.','H2'],
'South bridge':['Chip van de chipset die de processor verbindt met de tragere onderdelen (USB, SATA, toetsenbord, geluid, netwerk). Intel: ICH.','H2'],
'MCH':['Memory Controller Hub: de north bridge bij Intel.','H2'],
'GMCH':['Graphics and Memory Controller Hub: north bridge met ingebouwde grafische chip.','H2'],
'ICH':['I/O Controller Hub: de south bridge bij Intel.','H2'],
'FSB':['Front Side Bus: de verbinding tussen processor en north bridge.','H2'],
'Interlink Dedicated Bus':['De verbinding tussen north bridge en south bridge.','H2'],
'DMA':['Direct Memory Access: een randapparaat zet gegevens rechtstreeks in het RAM, zonder de processor.','H2'],
'DMA-controller':['Deel van de chipset dat bij DMA de gegevens verplaatst.','H2'],
'Interrupt (IRQ)':['Interrupt ReQuest: een randapparaat vraagt via de chipset aandacht van de processor.','H2'],
'On board video':['Grafische chip die al in chipset of processor zit. Goedkoop en zuinig.','H2'],
'Aparte grafische kaart':['Extra kaart in een uitbreidingssleuf, krachtiger dan on board video.','H2'],
'Processorvoet':['Socket: de houder op het moederbord waar de processor in past. Moet exact passen.','H3'],
'Merk':['Intel of AMD. Het moederbord moet bij het merk passen.','H3'],
'Processorkernen':['Cores: rekeneenheden in de processor, zoals koks. Meer kernen = meer taken tegelijk.','H3'],
'Kloksnelheid':['In GHz: aantal tikken per seconde. 3 GHz = 3 miljard tikken per seconde.','H3'],
'Energieverbruik':['In watt. Meer watt = meer warmte = betere koeler nodig.','H3'],
'Cachegeheugen':['Klein, supersnel geheugen in de processor: het kruidenrekje naast het fornuis.','H3'],
'Wet van Moore':['Het aantal transistors op een chip verdubbelt ongeveer elke 2 jaar (Gordon Moore, 1965).','H3'],
'Transistor':['Piepklein schakelaartje op een chip.','H3'],
'Heatsink':['Koellichaam: metalen blok met vinnen dat warmte opneemt en afgeeft aan de lucht.','H4'],
'Heatpipes':['Koperen buisjes die warmte snel van de processor naar de vinnen brengen.','H4'],
'Ventilator':['Blaast lucht door de vinnen en neemt de warmte mee.','H4'],
'Top-flow koeler':['Luchtkoeler met de ventilator plat bovenop, blaast naar beneden. Laag en compact.','H4'],
'Tower koeler':['Hoge luchtkoeler, ventilator aan de zijkant, blaast naar de achterkant. Koelt beter, maar is groot.','H4'],
'Water- en oliekoeling':['Een pomp stuurt vloeistof langs de processor. Populair bij casemodding.','H4'],
'Casemodding':['Je pc-kast ombouwen en versieren (lichtjes, doorzichtige zijkant).','H4'],
'Peltier-koeling (TEC)':['Thermo Electric Cooler: plaatje dat met stroom aan één kant koud en aan de andere kant warm wordt.','H4'],
'Phase changer':['Koeling die werkt als een koelkast. Volgens de cursus enkel voor supercomputers.','H4'],
'Cascade':['Een serie phase changers achter elkaar.','H4'],
'Vloeibare stikstof':['Extreme koeling (ongeveer −196 °C). De stikstof wordt verbruikt tijdens de koeling.','H4'],
'Ventilator met koperen geleiding':['Laptopkoeling: een koperen buis brengt de warmte naar een kleine ventilator.','H4'],
'Koelplateau':['Plaat met ventilator(s) die je onder een laptop legt.','H4'],
'Temperatuurcontrole':['Met een programma (bv. HWMonitor) de temperatuur van processor en schijven bekijken.','H4'],
'Geluidsniveau':['Hoe luid een koeler is, in decibel (dB). Lager = stiller.','H4'],
'Compatibiliteit':['Of onderdelen bij elkaar passen, bv. koeler of processor op de processorvoet.','H4'],
'Firmware':['Vaste instructies in het ROM van een apparaat, bv. het BIOS/UEFI.','H5'],
'EEPROM':['Electrically Erasable Programmable ROM: elektrisch wisbaar en opnieuw programmeerbaar ROM.','H5'],
'Flash ROM':['Flash-geheugen: snellere soort EEPROM die in blokken gewist wordt (zoals een USB-stick).','H5'],
'Flashen':['Nieuwe firmware in het ROM schrijven.','H5'],
'Schaduwen':['Shadowing: de inhoud van het trage ROM naar het snelle RAM kopiëren.','H5'],
'BIOS/UEFI':['De firmware op het moederbord die de pc opstart. Staat in flash-ROM.','H5'],
'Random Access':['Willekeurig: elke geheugencel is even snel bereikbaar, in eender welke volgorde.','H6'],
'Refresh rate':['Hoe vaak geheugencellen opnieuw opgeladen (ververst) worden. Het Sleutelboek gebruikt het ook voor de snelheid van het geheugen.','H6'],
'Condensator':['Minibatterijtje dat één geheugencel vormt; houdt zijn lading maar heel kort.','H6'],

function gloss(opt){let best=null;const o=String(opt).toLowerCase();for(const k in G){const kl=k.toLowerCase();if(o===kl||o.startsWith(kl)||kl.startsWith(o)){if(!best||k.length>best.length)best=k;}}if(!best){for(const k in G){const kl=k.toLowerCase().replace(/ \(.*\)$/,'');if(kl.length>=3&&o.includes(kl)&&(!best||k.length>best.length))best=k;}}return best?G[best][0]:null;}

  plan:['Lees wat het onderdeel doet (of de situatie).','Zoek het beeld in het restaurant.','Kies het onderdeel met die taak.'],
  vb:['Vraag: "Welk onderdeel bewaart je bestanden ook zonder stroom?"','Stap 1 · Het gaat over bewaren, ook als de stroom weg is.','Stap 2 · In het restaurant: wat blijft liggen als het restaurant sluit? De voorraadkast.','Stap 3 · De voorraadkast = de opslag (SSD/HDD). Niet het RAM: dat is het werkblad en wordt leeggemaakt.']},
 {id:'E2',ch:'H2',title:'De chipset: controllers en bridges',gen:genE2,
  uitleg:'De chipset heeft drie functies: System controller (klokgenerator, interrupts, DMA, energiebeheer), Peripheral controller (uitbreidingskaarten, HDD/optische stations, toetsenbord, I/O controller randapparaten) en Memory controller (werkgeheugen). De north bridge (MCH/GMCH) verbindt de processor met de snellere onderdelen, de south bridge (ICH) met de tragere.',
  plan:['Gaat het over een taak? Kies System, Peripheral of Memory controller.','Gaat het over een verbinding? Snel onderdeel (RAM, grafische kaart) = north bridge; traag (USB, SATA, toetsenbord, geluid, netwerk) = south bridge.','Afkorting? MCH = north, ICH = south, G = met grafische chip.'],
  vb:['Vraag: "Via welke chip zijn de USB-poorten verbonden met de processor?"','Stap 1 · Het gaat over een verbinding, dus north of south bridge.','Stap 2 · USB is een traag onderdeel.','Stap 3 · Traag = south bridge (ICH).']},
 {id:'E3',ch:'H2',title:'DMA of interrupt?',gen:genE3,
  uitleg:'DMA (Direct Memory Access): een randapparaat zet gegevens rechtstreeks in het RAM via de DMA-controller, zonder dat de processor ze moet dragen. Interrupt (IRQ, Interrupt ReQuest): een randapparaat vraagt via de chipset aandacht van de processor; die onderbreekt even zijn werk.',
  plan:['Worden er (veel) gegevens verplaatst naar of uit het RAM? → DMA.','Vraagt een toestel alleen aandacht ("ik heb iets!")? → Interrupt.','Tip: een melding "klaar!" na een DMA-kopie is zelf een interrupt.'],
  vb:['Vraag: "Je klikt met de muis. Welke techniek?"','Stap 1 · Worden er grote hoeveelheden gegevens naar het RAM gebracht? Nee.','Stap 2 · Vraagt de muis aandacht van de processor? Ja: "er is geklikt!".','Stap 3 · Dus: interrupt (IRQ).']},
 {id:'E4',ch:'H3',title:'Processor kiezen',gen:genE4,
  uitleg:'Zes factoren bij aankoop: processorvoet (socket), merk (Intel/AMD), aantal processorkernen, kloksnelheid (GHz), energieverbruik (W) en cachegeheugen (MB). Eerst moet hij passen (voet, merk), dan kijk je hoe goed hij is.',
  plan:['Kijk eerst naar de processorvoet: past hij op het moederbord?','Controleer het merk (AM4/AM5 = AMD, LGA = Intel).','Vergelijk dan kernen, kloksnelheid en cache; kijk naar de watt voor de koeler.'],
  vb:['Vraag: moederbord met voet AM4. Keuze: Ryzen 5 5600 (AM4) of Core i5-12400 (LGA1700).','Stap 1 · Voet: alleen de Ryzen 5 5600 heeft AM4.','Stap 2 · Merk: AM4 is AMD. Klopt.','Stap 3 · 6 kernen, 3,5 GHz, 32 MB cache, 65 W: prima. Antwoord: Ryzen 5 5600.']},
 {id:'E5',ch:'H3',title:'Rekenen met de wet van Moore',gen:genE5,
  uitleg:'Wet van Moore: het aantal transistors op een chip verdubbelt ongeveer elke 2 jaar.',
  plan:['Hoeveel jaar zit ertussen? (eindjaar − beginjaar)','Deel door 2: zoveel keer verdubbelen.','Verdubbel zoveel keer: × 2, × 2, …'],
  vb:['Vraag: 1 miljoen transistors in 2010. Hoeveel in 2016?','Stap 1 · 2016 − 2010 = 6 jaar.','Stap 2 · 6 ÷ 2 = 3 keer verdubbelen.','Stap 3 · 1 → 2 → 4 → 8. Antwoord: 8 miljoen.']},
 {id:'E6',ch:'H4',title:'De juiste koeling',gen:genE6,
  uitleg:'Een processorkoeler: heatsink (blok met vinnen), heatpipes (koperen buisjes), ventilator. Top-flow = laag, tower = hoog en beter. Voor gevorderden: water- en oliekoeling, Peltier (TEC), phase changer (cascade), vloeibare stikstof. Laptop: ventilator met koperen geleiding, koelplateau. Aankoop: type, compatibiliteit met moederbord, geluidsniveau.',
  plan:['Welk probleem of welke situatie? (plaats, laptop, lawaai, extreem)','Welke koeling of welk onderdeel past daarbij?','Controleer: past het (compatibiliteit), en is het stil genoeg?'],
  vb:['Vraag: "Kleine, lage kast: welke luchtkoeler?"','Stap 1 · Probleem: weinig hoogte.','Stap 2 · Tower = hoog, top-flow = laag.','Stap 3 · Antwoord: top-flow koeler.']},
 {id:'E7',ch:'H5',title:'ROM, flashen en schaduwen',gen:genE7,
  uitleg:'ROM = Read Only Memory: bevat firmware en houdt die zonder stroom. EEPROM = Electrically Erasable Programmable ROM. Flash ROM = snellere soort, per blok gewist. Flashen = nieuwe firmware schrijven. Schaduwen = inhoud van het trage ROM naar het snelle RAM kopiëren.',
  plan:['Gaat het over bewaren zonder stroom of firmware? → ROM.','Nieuwe firmware schrijven? → flashen.','ROM naar RAM kopiëren voor snelheid? → schaduwen.'],
  vb:['Vraag: "Waarom kopieert de pc het ROM naar het RAM?"','Stap 1 · Het gaat over kopiëren van ROM naar RAM: dat is schaduwen.','Stap 2 · ROM is traag toegankelijk, RAM snel.','Stap 3 · Antwoord: omdat RAM sneller toegankelijk is.']},
 {id:'E8',ch:'H6',title:'DDR ↔ PC omzetten',gen:genE8,
  uitleg:'Een latje heeft twee namen: DDR3-1600 (frequentie 1600 MHz) en PC3-12800 (overdrachtssnelheid 12 800 MB/s). Per overdracht gaan er 8 bytes (64 bits). Regel: PC-getal = DDR-getal × 8. De generatie blijft gelijk: DDR3 ↔ PC3. Bij de eerste generatie: DDR-400 = PC-3200.',
  plan:['Generatie overnemen: DDR3 → PC3, DDR4 → PC4 (en omgekeerd).','Van DDR naar PC: × 8. Van PC naar DDR: ÷ 8.','Schrijf de naam volledig: PC3-12800 of DDR3-1600.'],
  vb:['Vraag: DDR3-1600 = ?','Stap 1 · Generatie: DDR3 → PC3.','Stap 2 · 1600 × 8 = 12 800.','Stap 3 · Antwoord: PC3-12800.']},
 {id:'E9',ch:'H6',title:'Werking van RAM in 5 stappen',gen:genE9,
  uitleg:'1 De processor plaatst het adres op de adresbus. 2 De geheugencontroller bepaalt op welke chip het staat. 3 De hele rij (array) wordt ingelezen. 4 Met het kolomadres wordt de juiste geheugencel gekozen. 5 De gegevens gaan via de databus naar de processor.',
  plan:['Begin bij de processor: adres op de adresbus.','Dan zoeken: chip (controller) → rij → kolom (cel).','Eindig bij de processor: databus.'],
  vb:['Vergelijk met een stoel in de cinema.','Stap 1 · Je zegt je ticketnummer (adres).','Stap 2 · De juiste zaal zoeken (geheugenchip).','Stap 3 · De rij (array), daarna het stoelnummer (kolom), en dan ga je zitten: gegevens terug via de databus.']},
 {id:'E10',ch:'H6',title:'Geheugenmodules en kenmerken',gen:genE10,
  uitleg:'Random = willekeurig. Refresh: condensatoren verliezen hun lading. Generaties: SD-RAM 1, DDR 2, DDR2 4, DDR3 8 gegevens per klokpuls. DIMM = desktop, SO-DIMM = laptop, RIMM/CRIMM = Rambus. Single/dual/triple/quad channel. ECC voor servers. Aankoop: capaciteit, data access time, refresh rate, CAS-latency.',
  plan:['Zoek het sleutelwoord: laptop/desktop, aantal modules, fouten, wachten …','Koppel het aan de term (SO-DIMM, dual channel, ECC, CAS-latency …).','Twijfel? Gebruik de Engelse betekenis: dual = 2, triple = 3, quad = 4.'],
  vb:['Vraag: "Wat is efficiënter: 2 × 2 GB of 1 × 4 GB?"','Stap 1 · Sleutelwoord: aantal modules.','Stap 2 · Twee gelijke modules kunnen tegelijk werken: dual channel.','Stap 3 · Antwoord: 2 × 2 GB.']},
 {id:'E11',ch:'P',title:'Waar zit het probleem?',gen:genE11,
  uitleg:'In de praktijk krijg je geen definitie, maar een klacht. Je zoekt welk onderdeel of welk begrip de oorzaak is.',
  plan:['Wat is het symptoom? (past niet, te heet, traag, start niet, gegevens weg)','Welk hoofdstuk hoort daarbij? (voet → H3, warmte → H4, flashen → H5, latjes → H6 …)','Kies de oorzaak die het symptoom verklaart.'],
  vb:['Vraag: "Laptop op dekbed wordt heet en hapert."','Stap 1 · Symptoom: te heet.','Stap 2 · Hoofdstuk: koeling (H4). Laptop = ventilator met koperen geleiding.','Stap 3 · Oorzaak: de luchtgaten zijn afgesloten door het dekbed.']},
 {id:'E12',ch:'mix',title:'Gemengde oefening',gen:()=>{const e=rnd(EX.filter(x=>x.id!=='E12'));const q=e.gen();q.from=e.title;return q;},
  uitleg:'Hier komen alle soorten vragen door elkaar, zoals in de eindtoets.',plan:['Lees rustig: welk hoofdstuk is dit?','Gebruik het stappenplan van dat soort vraag.','Fout? Lees de feedback en probeer een nieuwe opgave.'],
  vb:['Tip · Bovenaan elke opgave zie je uit welke oefening ze komt.','Tip · Twijfel je, open dan het tabblad Theorie in een tweede venster.','Tip · Een hint gebruiken mag; "Toon oplossing" telt niet als juist.']}];
const REQ=EX.map(e=>e.id); // alle oefeningen bevatten toetsleerstof → allemaal verplicht
const NEED=2;
function okCount(id){return (S.prog[id]&&S.prog[id].ok)||0;}
function allDone(){return REQ.every(id=>okCount(id)>=NEED);}
function toetsOpen(){return S.unlocked||allDone();}

const TH={
H1:`<p>Een computer bestaat uit onderdelen die elk één taak hebben. Je hoeft ze niet te kunnen bouwen, wel herkennen en zeggen wat ze doen.</p>
<div class="box vgl"><h4>Vergelijk: een restaurant</h4><p>Processor = chef-kok · RAM = werkblad · opslag = voorraadkast · ROM = vast recept aan de muur · moederbord = gebouw met gangen · chipset = verkeersagent · voeding = elektriciteitskast · koeler = dampkap.</p></div>
<div class="fig">${img('cpu','Processor (CPU)')}${img('moederbord','Moederbord')}${img('ramlatje','Werkgeheugen (RAM)')}${img('voeding','Voeding (PSU)')}${img('sata','SATA-kabel')}</div>
<div class="tbl"><table><tr><th>Onderdeel</th><th>Wat doet het?</th></tr>
<tr><td>Processor (CPU)</td><td>Central Processing Unit: voert alle berekeningen uit.</td></tr>
<tr><td>Moederbord</td><td>Grote printplaat waarop alles wordt aangesloten.</td></tr>
<tr><td>Werkgeheugen (RAM)</td><td>Bevat wat nu open staat. Vluchtig: zonder stroom leeg.</td></tr>
<tr><td>Opslag: SSD of HDD</td><td>Bewaart bestanden blijvend. SSD: geen bewegende delen, stil, schokbestendig, tot 10× sneller. HDD: draaiende schijf, veel ruimte.</td></tr>
<tr><td>Grafische kaart (GPU)</td><td>Maakt het beeld. Ingebouwd (on board) volstaat voor school; voor games een aparte kaart.</td></tr>
<tr><td>Voeding (PSU)</td><td>Zet 230 V wisselspanning (AC) om in gelijkspanning (DC) voor alle componenten.</td></tr>
<tr><td>SATA-kabel</td><td>Dataverbinding tussen moederbord en harde schijf, SSD of dvd-station.</td></tr>
<tr><td>Koeler</td><td>Voert de warmte van de processor af.</td></tr>
<tr><td>Behuizing</td><td>De kast: beschermt tegen stof en stoten.</td></tr></table></div>
<div class="box onthoud"><h4>Onthoud</h4><p>Geheugen (RAM) is iets anders dan opslag (SSD/HDD). RAM = nu bezig en vluchtig, opslag = bewaren.</p></div>
<div class="box vb"><h4>Voorbeeld uit de opdracht PC Hardware</h4><p><b>Foto:</b> metalen doos met ventilator en veel kabels → <b>Wat:</b> PC-voeding → <b>Gebruik:</b> DC-spanning geven voor alle componenten in de computer.<br><b>Foto:</b> dunne platte rode kabel met L-stekker → <b>Wat:</b> SATA-kabel → <b>Gebruik:</b> dataverbinding tussen moederbord en harde schijf, SSD of dvd-station.</p></div>
<p class="small">Webshops zoals de PC-Builder van ALTERNATE laten je kiezen in deze volgorde: CPU, moederbord, CPU-koeler, geheugen, grafische kaart, SSD, behuizing, case fan, voeding, besturingssysteem. Ze controleren of alles past.</p>`,
H2:`<p>De <b>chipset</b> is een groep chips op het moederbord die al het verkeer regelt tussen processor, geheugen en randapparaten.</p>
<div class="fig">${img('agent','De chipset: een verkeersagent')}${img('moederbord','Chipset op het moederbord')}</div>
<div class="box vgl"><h4>Vergelijk: een verkeersagent</h4><p>Op een druk kruispunt bepaalt de agent wie mag rijden en wanneer. Zonder agent: botsingen en file.</p></div>
<div class="box vb"><h4>Woorden die je eerst moet kennen</h4><p><b>Bus</b> = een snelweg voor gegevens (bundel draadjes op het moederbord). <b>Klokpuls</b> = één tik van het uurwerk (de klokgenerator); alles werkt op die maat. <b>Uitbreidingssleuf</b> = sleuf waarin je een extra kaart steekt. <b>Optisch station</b> = cd/dvd-station.</p></div>
<h3>Functies van de chipset</h3>
<div class="tbl"><table><tr><th>System controller</th><th>Peripheral controller</th><th>Memory controller</th></tr>
<tr><td>klokgenerator<br>interrupts<br>DMA<br>energiebeheer</td><td>uitbreidingskaarten<br>HDD / optische stations<br>toetsenbord<br>I/O controller randapparaten</td><td>besturing werkgeheugen</td></tr></table></div>
<p>De chipset <b>bepaalt</b>: type processor, type werkgeheugen, capaciteit werkgeheugen, snelheid systeembus, aantal en soort uitbreidingssleuven, energiebeheer en controle op temperatuur van de CPU. <b>On board video</b> (grafische chip ingebouwd) is goedkoop en zuinig; een <b>aparte grafische kaart</b> is krachtiger.</p>
<h3>Structuur</h3>
<ul><li><b>North bridge</b> (Intel: MCH, Memory Controller Hub, of GMCH met grafische chip): verbindt de processor met de <b>snellere</b> onderdelen (RAM, grafische kaart). Tussen processor en north bridge loopt de <b>FSB</b> (Front Side Bus).</li>
<li><b>South bridge</b> (Intel: ICH, I/O Controller Hub): verbindt de processor met de <b>tragere</b> onderdelen (USB, SATA, toetsenbord, geluid, netwerk).</li>
<li>North en south bridge zijn verbonden via de <b>Interlink Dedicated Bus</b>.</li></ul>
<p class="small">Aanvulling: in moderne pc's zit de north bridge in de processor; de overgebleven chip heet PCH.</p>
<h3>DMA en interrupts</h3>
<p><b>DMA (Direct Memory Access):</b> een randapparaat zet gegevens rechtstreeks in het RAM via de DMA-controller, zonder de processor. <b>Interrupt (IRQ, Interrupt ReQuest):</b> een randapparaat vraagt via de chipset aandacht van de processor.</p>
<div class="box vgl"><h4>Vergelijk</h4><p>DMA = de leverancier zet de dozen rechtstreeks in de koelcel. Interrupt = de ober tikt op de bel: "Bestelling!"</p></div>
<div class="box vb"><h4>Voorbeeld: je drukt op "a"</h4><p>1 Het toetsenbord stuurt een IRQ naar de chipset. 2 De chipset geeft het door aan de CPU. 3 De CPU onderbreekt zijn werk en leest de toets. 4 De "a" verschijnt. 5 De CPU gaat verder.</p></div>
<div class="box onthoud"><h4>Onthoud</h4><p>System = klok en regels (ook DMA en interrupts) · Peripheral = alles rondom · Memory = geheugen. North = snel, south = traag. DMA = gegevens verplaatsen zonder CPU, interrupt = aandacht vragen.</p></div>`,
H3:`<p>Bijna alle processoren komen van <b>Intel</b> of <b>AMD</b>. Een Intel-processor past niet op een AMD-moederbord en omgekeerd.</p>
<div class="fig">${img('desktop','Desktop')}${img('laptop','Laptop')}${img('moore','Wet van Moore 1971–2008')}</div>
<p><b>Desktops versus laptops:</b> een laptop werkt op een batterij en neemt energiebesparende maatregelen: de <b>kloksnelheid wordt aangepast aan de belasting</b>.</p>
<div class="box vgl"><h4>Vergelijk: een fietser die schakelt</h4><p>Bergop trapt hij hard, op een vlakke weg rustig.</p></div>
<h3>Factoren bij de aankoop</h3>
<div class="tbl"><table><tr><th>Factor</th><th>Uitleg</th><th>Vergelijking</th></tr>
<tr><td>Processorvoet</td><td>Socket op het moederbord, moet exact passen</td><td>stekker en stopcontact</td></tr>
<tr><td>Merk</td><td>Intel of AMD</td><td>twee automerken</td></tr>
<tr><td>Aantal processorkernen</td><td>Cores: meer taken tegelijk</td><td>aantal koks</td></tr>
<tr><td>Kloksnelheid</td><td>GHz: 3 GHz = 3 miljard tikken per seconde</td><td>hoe snel één kok werkt</td></tr>
<tr><td>Energieverbruik</td><td>Watt: meer watt = meer warmte</td><td>—</td></tr>
<tr><td>Cachegeheugen</td><td>MB: klein supersnel geheugen in de processor</td><td>kruidenrekje naast het fornuis</td></tr></table></div>
<div class="box vb"><h4>Voorbeeld: Lisa, moederbord met voet AM4</h4><p>AMD Ryzen 5 5600 (AM4, 6 kernen, 3,5 GHz, 65 W, 32 MB) of Intel Core i5-12400 (LGA1700, 6 kernen, 2,5 GHz, 65 W, 18 MB)? Stap 1: alleen de Ryzen past op AM4. Stap 2: AM4 = AMD, klopt. Stap 3: kernen, klok, cache prima. Stap 4: 65 W, gewone koeler. Besluit: Ryzen 5 5600.</p></div>
<h3>De wet van Moore</h3>
<p>Gordon Moore (1965): het aantal transistors op een chip <b>verdubbelt ongeveer elke 2 jaar</b>.</p>
<div class="box vb"><h4>Voorbeeld</h4><p>1 miljoen transistors in 2010. In 2016? 6 jaar ÷ 2 = 3 keer verdubbelen: 1 → 2 → 4 → <b>8 miljoen</b>.</p></div>
<div class="box onthoud"><h4>Onthoud</h4><p>Eerst passen (voet, merk), dan kwaliteit (kernen, kloksnelheid, cache), dan warmte (energieverbruik). Moore: jaren ÷ 2 = aantal keer × 2.</p></div>`,
H4:`<p>Een processor zet stroom om in warmte. Te heet? Dan vertraagt hij of valt de pc uit.</p>
<div class="fig">${img('koelerdelen','Heatsink, heatpipes, ventilator')}${img('topflow','Top-flow koeler')}${img('tower','Tower koeler')}</div>
<ul><li><b>Heatsink</b>: metalen blok met vinnen (zoals een radiator).</li><li><b>Heatpipes</b>: koperen buisjes die de warmte snel wegbrengen.</li><li><b>Ventilator</b>: blaast de warmte weg.</li></ul>
<p><b>Top-flow koeler</b>: ventilator plat bovenop, blaast naar beneden, laag en compact. <b>Tower koeler</b>: hoog, ventilator aan de zijkant, koelt beter maar is groot.</p>
<h3>Voor gevorderden</h3>
<div class="fig">${img('waterkoeling','Water- en oliekoeling')}${img('peltier','Peltier-koeling (TEC)')}${img('phasechanger','Phase changer')}${img('stikstof','Vloeibare stikstof')}</div>
<ul><li><b>Water- en oliekoeling</b>: pomp + vloeistof, populair bij casemodding.</li><li><b>Peltier-koeling</b>, TEC (Thermo Electric Cooler): met stroom één kant koud.</li><li><b>Phase changer</b>: werkt als een koelkast; een serie heet een <b>cascade</b>. Volgens de cursus enkel voor supercomputers.</li><li><b>Vloeibare stikstof</b>: wordt verbruikt tijdens de koeling. Volgens de cursus enkel voor supercomputers.</li></ul>
<h3>Laptops, controle en onderhoud</h3>
<div class="fig">${img('laptopkoeler','Ventilator met koperen geleiding')}${img('koelplateau','Koelplateau')}${img('hwmonitor','Temperatuurcontrole (HWMonitor)')}${img('stof','Stof: reinigen!')}</div>
<p>Laptop: <b>ventilator met koperen geleiding</b> en eventueel een <b>koelplateau</b>. <b>Temperatuurcontrole</b> met een programma zoals HWMonitor. <b>Koelventilatoren reinigen</b>: pc uit, stekker eruit, stof wegblazen.</p>
<div class="box vb"><h4>Voorbeeld: Jonas, stille pc, kleine kast (max 120 mm), voet AM4</h4><p>A: tower 160 mm, AM4, 25 dB · B: top-flow 70 mm, AM4, 30 dB · C: top-flow 65 mm, LGA1700, 22 dB. Compatibiliteit: C valt af. Type: A te hoog. Geluidsniveau: B. Besluit: <b>koeler B</b>.</p></div>
<div class="box onthoud"><h4>Onthoud</h4><p>Aankoop koeler: type, compatibiliteit met moederbord, geluidsniveau. Heatsink = vinnen, heatpipes = buisjes, heatspreader = plaatje op RAM (H6).</p></div>`,
H5:`<p><b>ROM = Read Only Memory</b>: geheugen dat je (normaal) alleen leest. De inhoud blijft bewaard zonder stroom. Er staat <b>firmware</b> in, bv. het BIOS/UEFI dat de pc opstart.</p>
<div class="fig">${img('romchip','ROM-chip')}</div>
<div class="box vgl"><h4>Vergelijk</h4><p>Het recept dat in de keukenmuur gebeiteld is: iedereen kan het lezen, niemand wist het per ongeluk uit.</p></div>
<h3>Bouw van ROM</h3>
<p>Read Only Memory → niet herprogrammeerbaar → moeilijk herprogrammeerbaar → "flashen".</p>
<ul><li><b>EEPROM</b> = Electrically Erasable Programmable ROM: elektrisch wisbaar en opnieuw programmeerbaar.</li><li><b>Flash ROM</b> (flash-geheugen): snellere soort die in blokken gewist wordt, zoals een USB-stick.</li><li><b>Flashen</b> = nieuwe firmware in het ROM schrijven.</li></ul>
<h3>Lezen uit het ROM: schaduwen</h3>
<p>ROM is <b>traag</b> toegankelijk, RAM <b>snel</b>. Bij het opstarten kopieert de pc de inhoud van het ROM naar het RAM: <b>schaduwen</b> (shadowing).</p>
<div class="box vgl"><h4>Vergelijk</h4><p>Je schrijft het recept van de muur over op een briefje op je werkblad.</p></div>
<p><b>Toepassingen:</b> firmware op andere computeronderdelen (grafische kaart, harde schijf, dvd-station) en in allerlei elektronische apparaten (wasmachine, tv, router, printer, gameconsole).</p>
<div class="box vb"><h4>Voorbeeld uit het leven</h4><p>"Systeemupdate bezig, zet het toestel niet uit": je console wordt geflasht. Valt de stroom halverwege, dan staat er een halve firmware in het ROM en start het toestel niet meer.</p></div>
<div class="box onthoud"><h4>Onthoud</h4><p>ROM: blijft zonder stroom, bevat firmware. Flashen = schrijven. Schaduwen = ROM → RAM voor snelheid.</p></div>`,
H6:`<p><b>RAM = Random Access Memory</b>. Random = willekeurig: elke geheugencel is even snel bereikbaar, in eender welke volgorde. RAM is vluchtig.</p>
<div class="box vgl"><h4>Vergelijk</h4><p>Een kast met genummerde laatjes: je opent meteen laatje 512. Refresh: een lekke fietsband die je steeds bijpompt.</p></div>
<p><b>Refresh rate:</b> elke cel is een condensator, en condensatoren behouden stroom slechts erg kort, dus ze moeten steeds ververst worden. De frequentie van het RAM wordt aangepast aan de FSB.</p>
<h3>Geheugengeneraties</h3>
<div class="tbl"><table><tr><th>Generatie</th><th>Gegevens per klokpuls (cursus)</th><th>Status</th></tr><tr><td>SD-RAM</td><td class="num">1</td><td>verouderd</td></tr><tr><td>DDR (Double Data Rate)</td><td class="num">2</td><td>verouderd</td></tr><tr><td>DDR2</td><td class="num">4</td><td>oud</td></tr><tr><td>DDR3</td><td class="num">8</td><td>oud</td></tr><tr><td>DDR4 / DDR5</td><td>2014 / 2020 (aanvulling)</td><td>nu</td></tr></table></div>
<p>Elke generatie heeft de inkeping op een andere plaats: een DDR4-latje past niet in een DDR3-sleuf.</p>
<div class="box vb"><h4>Voorbeeld: DDR3-1600 = PC3-12800</h4><p>Stap 1: generatie blijft gelijk (DDR3 → PC3). Stap 2: per overdracht 8 bytes. Stap 3: 1600 × 8 = 12 800 MB/s → PC3-12800. Omgekeerd: PC4-25600 → 25 600 ÷ 8 = 3200 → DDR4-3200.<br><span class="small">Let op: in de cursus staat "12 800 Mbit/s"; juist is MB/s.</span></p></div>
<h3>Werking van RAM</h3>
<div class="fig">${img('ramschema','Processor, geheugencontroller, chip, array, cel')}</div>
<ol><li>De processor plaatst het gewenste geheugenadres op de adresbus van de systeembus.</li><li>De geheugencontroller bepaalt op welke geheugenchip dit adres te vinden is.</li><li>Van de juiste geheugenchip wordt de hele rij (array) ingelezen.</li><li>Daarna wordt uit die array de juiste geheugencel gepikt op basis van het kolomadres.</li><li>De gegevens uit die geheugencel worden op de databus geplaatst, naar de processor.</li></ol>
<div class="box vgl"><h4>Vergelijk: een stoel in de cinema</h4><p>Zaal (chip) → rij (array) → stoelnummer (kolom).</p></div>
<h3>Geheugenmodules</h3>
<div class="fig">${img('heatspreader','Heatspreader')}${img('dimm','DIMM (desktop)')}${img('sodimm','SO-DIMM (laptop)')}${img('sticker','Sticker')}${img('rimm','RIMM en CRIMM')}</div>
<ul><li><b>DIMM</b> (desktop) · <b>SO-DIMM</b> (laptop) · <b>heatspreader</b> (warmteverspreider).</li><li>Sticker: capaciteit, aantal geheugenchips, typenummer, generatie, refresh rate, geheugentype, CAS-latency.</li><li>Niet alle sleuven moeten gevuld zijn. Uitzondering: Rambus-geheugen (<b>RIMM</b>), lege sleuf = <b>CRIMM</b>.</li><li><b>Single channel</b>: per klokpuls slechts één module. <b>Dual channel</b>: twee tegelijk (zelfde type en capaciteit; 2 × 2 GB is efficiënter dan 1 × 4 GB). <b>Triple</b>: drie. <b>Quad</b>: vier.</li><li><b>ECC</b> (Error Correction Code): dubbele controle op fouten, voor servers.</li><li>Aankoop: <b>capaciteit</b>, <b>data access time</b>, <b>refresh rate</b>, <b>CAS-latency</b> (lager = sneller).</li><li>Practicum: werkgeheugen plaatsen in desktop en laptop, geheugen testen (Windows Geheugendiagnose).</li></ul>
<div class="box onthoud"><h4>Onthoud</h4><p>PC-getal = DDR-getal × 8. Adres → controller → rij → kolom → data. Laptop = SO-DIMM. Dual channel = 2 gelijke modules.</p></div>`};

 do{q=e.gen();tries++;}while(RECENT[id].includes(q.prompt)&&tries<12);
 RECENT[id].push(q.prompt);if(RECENT[id].length>6)RECENT[id].shift();
 q.state={sel:null,order:[],done:false,shown:false,hintShown:false};Q[id]=q;return q;}

 <details class="uitleg" ${okCount(e.id)===0?'open':''}><summary>Uitleg, stappenplan en uitgewerkt voorbeeld</summary><div>
 <p>${esc(e.uitleg)}</p><div class="box onthoud"><h4>Stappenplan</h4><ol style="margin:0;padding-left:20px">${e.plan.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>
 <div class="box vb"><h4>Uitgewerkt voorbeeld</h4><div class="stepper">${vbSteps}</div><div class="row"><button class="btn ghost" id="vbNext" type="button">Volgende stap</button><button class="btn ghost" id="vbReset" type="button">Opnieuw</button></div></div></div></details>
 <div class="q" id="qBox">${renderQ(q,e)}</div></section></div>`;}
function renderQ(q,e){let inp='';
 if(q.type==='mc')inp=`<div class="opts">${q.options.map(o=>`<button class="opt" type="button" data-o="${esc(o)}" aria-pressed="${q.state.sel===o}">${esc(o)}</button>`).join('')}</div>`;
 else if(q.type==='num')inp=`<div class="row"><input type="text" id="qIn" inputmode="decimal" autocomplete="off" aria-label="Jouw antwoord" style="width:180px"><span>${esc(q.unit||'')}</span></div>`;
 else if(q.type==='text')inp=`<div class="row"><input type="text" id="qIn" autocomplete="off" placeholder="${esc(q.placeholder||'')}" aria-label="Jouw antwoord" style="width:220px"></div>`;
 else if(q.type==='order'){q.state.pool=q.state.pool||shuffle(q.items);inp=`<ol class="chosen" id="chosen">${q.state.order.map(i=>`<li>${esc(i)}</li>`).join('')}</ol><div class="ordersel">${q.state.pool.map(i=>`<button type="button" data-i="${esc(i)}" ${q.state.order.includes(i)?'disabled':''}>${esc(i)}</button>`).join('')}</div><div><button class="btn ghost" type="button" id="ordClear">Wis volgorde</button></div>`;}
 return `${q.from?`<p class="small">Uit: ${esc(q.from)}</p>`:''}<p class="prompt">${q.type==='mc'&&q.prompt.includes('<br>')?q.prompt:esc(q.prompt).replace(/&lt;b&gt;|&lt;\/b&gt;/g,m=>m.includes('/')?'</b>':'<b>')}</p>${inp}
 <div class="row"><button class="btn acc" type="button" id="qCheck">Controleer</button><button class="btn ghost" type="button" id="qHint">Hint</button><button class="btn ghost" type="button" id="qSol">Toon oplossing</button><button class="btn ghost" type="button" id="qNew">Nieuwe opgave</button></div><div id="qFb" aria-live="polite"></div>`;}

 bindQ(e);}
function bindQ(e){const q=Q[e.id];const box=$('#qBox');
 box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(q.state.done)return;q.state.sel=o.dataset.o;box.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===o?'true':'false'));});
 box.querySelectorAll('.ordersel button').forEach(b=>b.onclick=()=>{if(q.state.done)return;q.state.order.push(b.dataset.i);rerenderQ(e);});
 const oc=$('#ordClear');if(oc)oc.onclick=()=>{if(q.state.done)return;q.state.order=[];rerenderQ(e);};
 const inp=$('#qIn');if(inp)inp.onkeydown=ev=>{if(ev.key==='Enter')$('#qCheck').click();};
 $('#qCheck').onclick=()=>checkQ(e);
 $('#qHint').onclick=()=>{q.state.hintShown=true;$('#qFb').innerHTML=`<div class="fb hint"><b>Hint:</b> ${esc(q.hint)}</div>`;};
 $('#qSol').onclick=()=>{q.state.shown=true;q.state.done=true;$('#qFb').innerHTML=`<div class="fb sol"><b>Oplossing:</b> ${esc(ansText(q))}<br>${esc(q.why)}<br><span class="small">Een getoonde oplossing telt niet als juist. Klik op "Nieuwe opgave".</span></div>`;markMC(q,box);};
 $('#qNew').onclick=()=>{newQ(e.id);rerenderQ(e);};}
function rerenderQ(e){$('#qBox').innerHTML=renderQ(Q[e.id],e);bindQ(e);}
function ansText(q){return q.type==='order'?q.items.map((x,i)=>(i+1)+'. '+x).join('  '):String(q.answer);}
function markMC(q,box){if(q.type!=='mc')return;box.querySelectorAll('.opt').forEach(x=>{if(x.dataset.o===q.answer)x.classList.add('right');else if(x.dataset.o===q.state.sel)x.classList.add('wrong');});}
function judge(q,val){ // geeft {ok, msg, empty}
 if(q.type==='mc'){if(val==null)return {empty:true};return {ok:val===q.answer,msg:val===q.answer?'':`Je koos "${val}". ${gloss(val)&&gloss(val)!==gloss(q.answer)?'Dat is: '+gloss(val)+' ':''}`};}
 if(q.type==='num'){const v=parseNum(val);if(v===null)return {empty:true};const ok=Math.abs(v-q.answer)<1e-9;return {ok,msg:ok?'':(q.diag&&q.diag(v))||'Dat getal klopt niet. Volg het stappenplan.'};}
 if(q.type==='text'){if(!String(val||'').trim())return {empty:true};const ok=normMem(val)===normMem(q.answer);return {ok,msg:ok?'':(q.diag&&q.diag(val))||'Dat klopt niet. Kijk naar het stappenplan.'};}
 if(q.type==='order'){if(!val||val.length<q.items.length)return {empty:true};const ok=val.every((x,i)=>x===q.items[i]);let first=val.findIndex((x,i)=>x!==q.items[i]);return {ok,msg:ok?'':`Stap ${first+1} klopt niet: daar hoort "${q.items[first]}".`};}}
function checkQ(e){const q=Q[e.id];const box=$('#qBox');if(q.state.done){$('#qFb').innerHTML=`<div class="fb sol">Deze opgave is afgerond. Klik op "Nieuwe opgave".</div>`;return;}
 let val=q.type==='mc'?q.state.sel:q.type==='order'?q.state.order:$('#qIn').value;
 const r=judge(q,val);
 if(r.empty){$('#qFb').innerHTML=`<div class="fb hint">${q.type==='mc'?'Kies eerst een antwoord.':q.type==='order'?'Klik eerst alle stappen aan.':'Vul eerst een antwoord in.'}</div>`;return;}
 q.state.done=true;const p=S.prog[e.id]=S.prog[e.id]||{ok:0,tries:0};p.tries++;
 if(e.id==='E12'){}
 if(r.ok){p.ok++;}
 save();markMC(q,box);const inp=$('#qIn');if(inp)inp.classList.add(r.ok?'good':'bad');
 $('#qFb').innerHTML=r.ok?`<div class="fb ok"><b>Juist!</b> ${esc(q.why)}${p.ok===NEED?'<br><b>Deze oefening is in orde voor de toets.</b>':''}</div>`:`<div class="fb no"><b>Niet juist.</b> ${esc(r.msg)}<br><b>Juist:</b> ${esc(ansText(q))}. ${esc(q.why)}</div>`;
 // navigatie-teller bijwerken
 const nb=document.querySelector(`.navbtn[data-ex="${e.id}"] .pill`);if(nb){nb.className='pill '+(p.ok>=NEED?'ok':'todo');nb.textContent=(p.ok>=NEED?'✓ ':'')+p.ok+'/'+NEED;}
 const sm=document.querySelector('#exPanel .small b');if(sm)sm.textContent=p.ok;updLock();}

/* ---------- controlecode ---------- */
const SALT='PCHW-sleutelboek-2026';
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function hashStr(s){let h=0x811c9dc5;s=s+'#'+SALT;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}let h2=0x12345678;for(let i=s.length-1;i>=0;i--){h2^=s.charCodeAt(i);h2=Math.imul(h2,0x5bd1e995)>>>0;}return (h.toString(36)+h2.toString(36)).toUpperCase();}
const PARTS_T=['H1','H2','H3','H4','H5','H6','P'];
const PLAN={H1:[['E1',4]],H2:[['E2',3],['E3',2]],H3:[['E4',2],['E5',2]],H4:[['E6',4]],H5:[['E7',4]],H6:[['E8',2],['E9',1],['E10',3]],P:[['E11',3]]};
const PMAX={H1:4,H2:5,H3:4,H4:4,H5:4,H6:6,P:3};
const EPOCH=Date.UTC(2026,0,1);
function makeCode(naam,klas,parts,dateStr,mins,poging,leaves){let p7=0;parts.forEach(x=>p7=p7*7+x);const days=Math.round((Date.UTC(+dateStr.slice(0,4),+dateStr.slice(5,7)-1,+dateStr.slice(8,10))-EPOCH)/864e5);
 let n=(((p7*4096+Math.max(0,Math.min(4095,days)))*256+Math.max(0,Math.min(255,mins)))*16+Math.max(0,Math.min(15,poging||1)))*16+Math.max(0,Math.min(15,leaves||0));const body=n.toString(36).toUpperCase();const chk=hashStr(norm(naam)+'|'+norm(klas)+'|'+body).slice(0,5);return body+'-'+chk;}
function readCode(naam,klas,code){code=String(code||'').trim().toUpperCase().replace(/\s/g,'');const m=code.match(/^([0-9A-Z]+)-([0-9A-Z]{5})$/);if(!m)return {ok:false,why:'De code heeft niet de juiste vorm (bv. 1ABC2DEF-XY12Z).'};
 const chk=hashStr(norm(naam)+'|'+norm(klas)+'|'+m[1]).slice(0,5);let n=parseInt(m[1],36);const leaves=n%16;n=Math.floor(n/16);const poging=n%16;n=Math.floor(n/16);const mins=n%256;n=Math.floor(n/256);const days=n%4096;n=Math.floor(n/4096);let p7=n;const parts=[];for(let i=0;i<7;i++){parts.unshift(p7%7);p7=Math.floor(p7/7);}const total=parts.reduce((a,b)=>a+b,0);
 const d=new Date(EPOCH+days*864e5);const ok=chk===m[2]&&p7===0&&parts.every((x,i)=>x<=PMAX[PARTS_T[i]]);
 return {ok,why:ok?'':'De code past niet bij deze naam en klas (let op spelling) of werd aangepast.',total,parts,date:d.toISOString().slice(0,10),mins,poging,leaves};}

function buildToets(){const qs=[];PARTS_T.forEach(p=>PLAN[p].forEach(([id,n])=>{const e=EX.find(x=>x.id===id);const seen=new Set(qs.map(q=>q.prompt));let c=0,g=0;while(c<n&&g<200){g++;let q=toMC(e.gen());if(q.type==='order'&&qs.some(x=>x.type==='order'))continue;if(seen.has(q.prompt))continue;seen.add(q.prompt);q.part=p;q.ans=null;if(q.type==='order')q.pool=shuffle(q.items);qs.push(q);c++;}}));
 return shuffle(qs);}

 box.querySelectorAll('.ordersel button').forEach(b=>b.onclick=()=>{q.ans=(q.ans||[]).concat(b.dataset.i);save();render();});
 const oc=$('#tOrdClr');if(oc)oc.onclick=()=>{q.ans=[];save();render();};
 const pv_=$('#tPrev');pv_.onclick=()=>{t.i--;save();render();};const nx=$('#tNext');if(nx)nx.onclick=()=>{t.i++;save();render();};
 $('#tEnd').onclick=()=>{const open=t.qs.filter(x=>x.ans==null||x.ans===''||(Array.isArray(x.ans)&&x.ans.length<x.items.length)).length;
  $('#tConfirm').innerHTML=`<div class="lockbox"><b>${open?`Je hebt nog ${open} vraag/vragen niet (volledig) beantwoord.`:'Alle vragen zijn beantwoord.'}</b><span>Na inleveren kan je niets meer veranderen.</span><div class="row"><button class="btn acc" id="tEndYes" type="button">Ja, lever in</button><button class="btn ghost" id="tEndNo" type="button">Nog even nakijken</button></div></div>`;
  $('#tEndNo').onclick=()=>{$('#tConfirm').innerHTML='';};$('#tEndYes').onclick=()=>finishToets();};}
function finishToets(){const t=S.toets;t.end=Date.now();const parts={};PARTS_T.forEach(p=>parts[p]=0);
 t.qs.forEach(q=>{const r=q.ans==null?{ok:false}:judge(q,q.ans);q.ok=!!(r&&r.ok);if(q.ok)parts[q.part]++;});
 t.parts=PARTS_T.map(p=>parts[p]);t.total=t.parts.reduce((a,b)=>a+b,0);const d=new Date(t.start);t.date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;t.mins=Math.max(0,Math.round((t.end-t.start)/60000));
 t.code=makeCode(t.naam,t.klas,t.parts,t.date,t.mins,t.poging,t.leaves);t.finished=true;save();render();window.scrollTo(0,0);}
function renderRapport(t){const st=new Date(t.start),en=new Date(t.end);const hm=d=>d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
 const dur=Math.round((t.end-t.start)/1000);const durTxt=`${Math.floor(dur/60)} min ${String(dur%60).padStart(2,'0')} s`;
 const rows=PARTS_T.map((p,i)=>`<tr><td>${p==='P'?'Praktijk':p} · ${esc(CH[p].replace('Praktijk: ',''))}</td><td class="num">${t.parts[i]} / ${PMAX[p]}</td><td style="width:30%"><div class="bar"><i style="width:${Math.round(t.parts[i]/PMAX[p]*100)}%"></i></div></td></tr>`).join('');
 const review=t.qs.map((q,i)=>`<div class="fb ${q.ok?'ok':'no'}"><b>${i+1}. ${q.ok?'Juist':'Fout'}</b> · ${q.prompt.includes('<br>')?q.prompt:esc(q.prompt).replace(/&lt;b&gt;|&lt;\/b&gt;/g,m=>m.includes('/')?'</b>':'<b>')}<br>Jouw antwoord: ${esc(q.ans==null||q.ans===''?'(leeg)':Array.isArray(q.ans)?q.ans.map((x,j)=>(j+1)+'. '+x).join(' '):q.ans)}${q.ok?'':`<br>Juist: ${esc(ansText(q))}. ${esc(q.why)}`}</div>`).join('');
 return `<section class="panel"><div class="report"><div><p class="eyebrow">Rapport eindtoets PC-hardware</p><h2>${esc(t.naam)}</h2></div>
 <dl class="kv"><dt>Klas</dt><dd>${esc(t.klas)}</dd><dt>Datum</dt><dd>${st.toLocaleDateString('nl-BE')}</dd><dt>Tijd</dt><dd>${hm(st)} – ${hm(en)}</dd><dt>Duur</dt><dd>${durTxt}</dd><dt>Poging</dt><dd>${t.poging||1}</dd><dt>Toets verlaten</dt><dd>${t.leaves||0} keer (ander tabblad of venster)</dd><dt>Score</dt><dd style="font-size:22px">${t.total} / 30 (${Math.round(t.total/30*100)} %)</dd></dl>
 <div class="tbl"><table><tr><th>Onderdeel</th><th>Score</th><th>Grafiek</th></tr>${rows}</table></div>
 <div><p class="small">Controlecode</p><span class="code">${t.code}</span></div>
 <p class="msg ok">Neem nu een screenshot van dit rapport (Windows-toets + Shift + S) en bezorg het aan je leerkracht.</p></div>
 <div class="row"><button class="btn ghost" id="tReview" type="button">Bekijk mijn antwoorden</button><button class="btn ghost" id="tNew" type="button">Nieuwe toets maken</button></div><div id="newConfirm"></div>
 <div id="reviewBox" hidden style="display:flex;flex-direction:column;gap:8px">${review}</div></section>`;}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.toets&&!S.toets.finished){S.toets.leaves=(S.toets.leaves||0)+1;save();}});
/* ---------- leerkracht ---------- */
$('#teachBtn').onclick=()=>openTeacher();
function openTeacher(){const r=$('#modalRoot');r.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="tkT"><div><h2 id="tkT">Leerkracht</h2><div id="tkBody"><div class="field"><label for="tkCode">Leerkrachtcode</label><input type="text" id="tkCode" inputmode="numeric" autocomplete="off"></div><div class="row"><button class="btn acc" id="tkGo" type="button">Open</button><button class="btn ghost" id="tkClose" type="button">Sluiten</button></div><div id="tkMsg"></div></div></div></div>`;
 const close=()=>r.innerHTML='';$('#tkClose').onclick=close;r.querySelector('.modal').onclick=ev=>{if(ev.target.classList.contains('modal'))close();};
 const c=$('#tkCode');c.focus();c.onkeydown=ev=>{if(ev.key==='Enter')$('#tkGo').click();};
 $('#tkGo').onclick=()=>{if(c.value.trim()!=='2026'){$('#tkMsg').innerHTML='<p class="msg no">Onjuiste code.</p>';return;}
  $('#tkBody').innerHTML=`<p>Toets op dit toestel: <b id="tkState">${toetsOpen()?'open':'op slot'}</b>. Oefeningen klaar: ${REQ.filter(id=>okCount(id)>=NEED).length}/${REQ.length}.</p>
  <div class="row"><button class="btn acc" id="tkUnlock" type="button">${S.unlocked?'Vergrendel de toets opnieuw':'Ontgrendel de toets'}</button></div>
  <h3>Rapportcode controleren</h3><p class="small">Typ naam en klas exact zoals op het rapport, en de controlecode.</p>
  <div class="field"><label for="vNaam">Naam</label><input type="text" id="vNaam"></div><div class="field"><label for="vKlas">Klas</label><input type="text" id="vKlas"></div><div class="field"><label for="vCode">Controlecode</label><input type="text" id="vCode" autocomplete="off"></div>
  <div class="row"><button class="btn" id="vGo" type="button">Controleer code</button></div><div id="vOut"></div>
  <h3>Dit toestel</h3><div class="row"><button class="btn ghost" id="tkReset" type="button">Wis alle voortgang op dit toestel</button></div><div id="tkRes"></div>
  <div class="row"><button class="btn ghost" id="tkClose2" type="button">Sluiten</button></div>`;
  $('#tkClose2').onclick=close;
  $('#tkUnlock').onclick=()=>{S.unlocked=!S.unlocked;save();$('#tkUnlock').textContent=S.unlocked?'Vergrendel de toets opnieuw':'Ontgrendel de toets';$('#tkState').textContent=toetsOpen()?'open':'op slot';render();};
  $('#vGo').onclick=()=>{const r2=readCode($('#vNaam').value,$('#vKlas').value,$('#vCode').value);
   $('#vOut').innerHTML=r2.ok?`<div class="fb ok"><b>Echt rapport.</b><br>Score ${r2.total}/30 · datum ${r2.date.split('-').reverse().join('/')} · duur ± ${r2.mins} min · poging ${r2.poging} · toets ${r2.leaves} keer verlaten${r2.leaves>=15?' of meer':''}<br>${PARTS_T.map((p,i)=>(p==='P'?'Praktijk':p)+': '+r2.parts[i]+'/'+PMAX[p]).join(' · ')}</div>`:`<div class="fb no"><b>Niet geldig.</b> ${esc(r2.why)}</div>`;};
  $('#tkReset').onclick=()=>{$('#tkRes').innerHTML=`<p class="msg warn">Alles wissen (oefeningen, praktijk, toets)? <button class="btn ghost" id="tkResYes" type="button">Ja, wis</button></p>`;$('#tkResYes').onclick=()=>{S={naam:'',klas:'',prog:{},unlocked:false,prak:{},toets:null,lastTab:'theorie'};save();close();render();};};};}

/* ---------- start ---------- */
const h=(location.hash||'').slice(1);setTab(['theorie','oefenen','praktijk','toets'].includes(h)?h:(S.lastTab||'theorie'));
window.__pchw={EX,S:()=>S,Q,judge,makeCode,readCode,buildToets,finishToets};
</script>
